# Install and configure Docker and Docker Compose

- name: Find any legacy Docker apt sources
  ansible.builtin.find:
    paths: /etc/apt/sources.list.d
    patterns: '*.list*'
    contains: '.*download\.docker\.com.*'
  register: legacy_docker_source

- name: Remove any legacy Docker apt sources
  ansible.builtin.file:
    path: '{{ item.path }}'
    state: absent
  loop: "{{ legacy_docker_source.files }}"
  loop_control:
    label: '{{ item.path | default("") | basename }}'

- name: Remove any legacy Docker keyrings
  ansible.builtin.file:
    path: '{{ item }}'
    state: absent
  loop:
    - /usr/share/keyrings/docker.gpg
    - /usr/share/keyrings/docker.gpg_armored

- name: Make sure the apt keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Add the Docker GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: "0644"

- name: Add the Docker repository
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    uris: https://download.docker.com/linux/ubuntu
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: stable
    architectures: "{{ docker_arch }}"
    signed_by: /etc/apt/keyrings/docker.asc
    state: present
  vars:
    docker_arch: "{{ 'arm64' if ansible_facts['architecture'] == 'aarch64' else 'amd64' }}"

- name: Refresh apt cache
  ansible.builtin.apt:
    update_cache: true

- name: Install Docker and Docker Compose
  ansible.builtin.apt:
    name: "{{ packages }}"
    state: present
  register: docker_packages
  vars:
    packages:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin

- name: Install the prerequisites for Docker container management via Ansible
  ansible.builtin.apt:
    name: "{{ packages }}"
    state: present
  vars:
    packages:
      - python3-docker
      - python3-passlib

- name: Verify the Docker service is started and enabled
  ansible.builtin.systemd_service:
    name: docker
    state: started
    enabled: true
    daemon_reload: true

# Restart the service if engines are swapped
- name: Restart Docker after a package change
  ansible.builtin.systemd_service:
    name: docker
    state: restarted
  when: docker_packages.changed
